name: my_dental
description: "ডেন্টাল ক্লিনিক ম্যানেজমেন্ট অ্যাপ"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Local Database (Drift / SQLite)
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28

  # Backend & Cloud Auth
  supabase_flutter: ^2.8.3
  flutter_dotenv: ^5.2.1

  # PDF Generation
  pdf: ^3.11.2
  printing: ^5.14.0

  # Utilities
  share_plus: ^10.1.4
  file_picker: ^8.1.7
  shared_preferences: ^2.5.6
  path_provider: ^2.1.5
  path: ^1.9.0
  intl: ^0.19.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.22.1
  build_runner: ^2.4.14

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/.env
